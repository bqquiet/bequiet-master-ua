<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>bequiet.</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <!-- Quill editor -->
  <link href="https://cdn.quilljs.com/1.3.7/quill.snow.css" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body class="bg-mesh">

  <!-- Loading Screen -->
  <div id="loading-screen">
    <svg class="loading-icon" width="48" height="48" viewBox="0 0 24 24" fill="none"
         stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="4 17 10 11 4 5"></polyline><line x1="12" y1="19" x2="20" y2="19"></line>
    </svg>
    <div class="loading-text">
      <svg class="loading-spinner" width="16" height="16" viewBox="0 0 24 24" fill="none"
           stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 12a9 9 0 1 1-6.219-8.56"/>
      </svg>
      <span>Initializing system...</span>
    </div>
  </div>

  <!-- Main App -->
  <div id="app" class="hidden" style="flex-direction:column; min-height:100vh;">
    <header id="navbar"></header>
    <main id="main-content" class="main-content fade-in"></main>
    <footer id="site-footer"></footer>
  </div>

  <!-- Fixed UI Elements -->
  <button id="back-to-top" aria-label="Back to top"></button>
  <div id="live-viewers"></div>

  <!-- Scripts -->
  <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
  <script src="https://cdn.quilljs.com/1.3.7/quill.js"></script>
  <script src="app.js"></script>
</body>
</html>
